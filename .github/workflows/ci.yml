name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_FONTDIR: 'C:\Windows\Fonts'  # the offscreen platform has no fonts of its own on Windows
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Notices up to date
        run: python tools/notices.py --check
      - name: Tests
        run: python -m pytest -q
