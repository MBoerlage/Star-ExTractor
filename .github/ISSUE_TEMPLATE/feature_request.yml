name: Feature request
description: An idea for Star ExTractor
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The observing or reduction task, and what is missing or slow today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could it work?
  - type: input
    id: hardware
    attributes:
      label: Spectrograph and camera
      placeholder: "Star'Ex LR + ZWO ASI585MM Pro"
