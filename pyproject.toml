[project]
name = "starextractor"
version = "0.2.1"
description = "Star ExTractor: spectroscopy reduction for low-resolution slit spectrographs (Star'Ex LR: stack, geometry, 1D extract, wavelength, response) and export for AAVSO AVSpec"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "astropy>=6.0",
  "PySide6>=6.6",
  "pyqtgraph>=0.13.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-qt>=4.2", "ruff>=0.4"]
build = ["pyinstaller>=6.11"]  # packaging/build.ps1 (Inno Setup 6 is installed separately)

[project.scripts]
starextractor = "starextractor.app:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["starextractor*"]

[tool.setuptools.package-data]
starextractor = ["ui/icons/*.svg", "ui/about/*.jpg", "resources/*", "data/*", "reference_spectra/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["realdata: needs the real sample frames in ..\\projects"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["example_spectra", "screenshots"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # en dashes, ×, Å, °, … are intended in UI text
